<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Seal Quality Inspection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: white;
      background: #101418;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(1200px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
    }

    .description {
      margin: 0 0 20px;
      color: #b9c1ca;
    }

    .camera-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 3px solid #39434d;
      border-radius: 14px;
      background: black;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .status-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .status-card {
      padding: 16px;
      text-align: center;
      border: 1px solid #39434d;
      border-radius: 10px;
      background: #1b2229;
    }

    .status-label {
      margin-bottom: 8px;
      color: #aab4be;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .status-value {
      font-size: 28px;
      font-weight: 800;
    }

    #decision.pass,
    #connectionStatus.live {
      color: #00e676;
    }

    #decision.waiting,
    #connectionStatus.connecting {
      color: #ffca28;
    }

    #decision.error,
    #connectionStatus.error {
      color: #ff5252;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      min-width: 160px;
      padding: 13px 20px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      background: #087f5b;
    }

    #stopButton {
      background: #c92a2a;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    #message {
      min-height: 48px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      color: #d6dce2;
      background: #1b2229;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .status-panel {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Seal Quality Inspection</h1>

    <p class="description">
      A part passes when exactly 10 seals are detected. PASS remains
      displayed until the part is removed from the camera.
    </p>

    <section class="camera-container">
      <video
        id="resultVideo"
        autoplay
        playsinline
        muted
      ></video>
    </section>

    <section class="status-panel">
      <div class="status-card">
        <div class="status-label">SEAL COUNT</div>
        <div id="sealCount" class="status-value">—</div>
      </div>

      <div class="status-card">
        <div class="status-label">INSPECTION</div>
        <div id="decision" class="status-value waiting">
          WAITING
        </div>
      </div>

      <div class="status-card">
        <div class="status-label">CONNECTION</div>
        <div id="connectionStatus" class="status-value">
          OFFLINE
        </div>
      </div>
    </section>

    <section class="controls">
      <button id="startButton">
        Start Inspection
      </button>

      <button id="stopButton" disabled>
        Stop Inspection
      </button>
    </section>

    <div id="message">
      Click “Start Inspection” to begin.
    </div>
  </main>

  <script type="module">
    import {
      connectors,
      streams,
      webrtc
    } from "https://esm.sh/@roboflow/inference-sdk";

    /*
     * Replace this with your actual Vercel endpoint.
     *
     * Example:
     * https://seal-inspection-proxy.vercel.app/api/init-webrtc
     */

    const VERCEL_PROXY_URL =
  "https://proxy-laes.vercel.app/api/init-webrtc";


    const WORKSPACE_NAME =
      "ricardo-avila-20lli";

    const WORKFLOW_ID =
      "wire-seal-detection-vwire-seal-detection-1-rfdetr-small-t1-logic";

    const IMAGE_INPUT_NAME = "image";
    const VIDEO_OUTPUT = "output_image";

    const DATA_OUTPUTS = [
      "seal_count",
      "decision",
      "pass_latched"
    ];

    const resultVideo =
      document.getElementById("resultVideo");

    const sealCountElement =
      document.getElementById("sealCount");

    const decisionElement =
      document.getElementById("decision");

    const connectionStatusElement =
      document.getElementById("connectionStatus");

    const messageElement =
      document.getElementById("message");

    const startButton =
      document.getElementById("startButton");

    const stopButton =
      document.getElementById("stopButton");

    let connection = null;
    let localCameraStream = null;
    let starting = false;

    function setMessage(message) {
      messageElement.textContent = message;
    }

    function setConnectionStatus(value) {
      const status =
        String(value || "OFFLINE").toUpperCase();

      connectionStatusElement.textContent = status;

      connectionStatusElement.classList.remove(
        "live",
        "connecting",
        "error"
      );

      if (status === "LIVE") {
        connectionStatusElement.classList.add("live");
      } else if (
        status === "CONNECTING" ||
        status === "CAMERA"
      ) {
        connectionStatusElement.classList.add(
          "connecting"
        );
      } else if (status === "ERROR") {
        connectionStatusElement.classList.add("error");
      }
    }

    function setDecision(value) {
      const decision =
        String(value || "WAITING").toUpperCase();

      decisionElement.textContent = decision;

      decisionElement.classList.remove(
        "pass",
        "waiting",
        "error"
      );

      if (decision === "PASS") {
        decisionElement.classList.add("pass");
      } else if (decision === "ERROR") {
        decisionElement.classList.add("error");
      } else {
        decisionElement.classList.add("waiting");
      }
    }

    function getOutputs(data) {
      if (
        data &&
        typeof data === "object" &&
        data.outputs &&
        typeof data.outputs === "object"
      ) {
        return data.outputs;
      }

      return data || {};
    }

    function handleInferenceData(data) {
      console.log("Roboflow Workflow data:", data);

      const outputs = getOutputs(data);

      if (outputs.seal_count !== undefined) {
        sealCountElement.textContent =
          String(outputs.seal_count);
      }

      if (outputs.decision !== undefined) {
        setDecision(outputs.decision);
      } else if (outputs.pass_latched !== undefined) {
        setDecision(
          outputs.pass_latched
            ? "PASS"
            : "WAITING"
        );
      }
    }

    function stopLocalCamera() {
      if (
        localCameraStream &&
        typeof localCameraStream.getTracks === "function"
      ) {
        localCameraStream
          .getTracks()
          .forEach((track) => track.stop());
      }

      localCameraStream = null;
    }

    async function startInspection() {
      if (starting || connection) {
        return;
      }

      if (
        !VERCEL_PROXY_URL ||
        VERCEL_PROXY_URL.includes(
          "YOUR-VERCEL-PROJECT"
        )
      ) {
        setConnectionStatus("ERROR");
        setDecision("ERROR");

        setMessage(
          "Replace YOUR-VERCEL-PROJECT with your actual Vercel project address."
        );

        return;
      }

      starting = true;

      startButton.disabled = true;
      stopButton.disabled = true;

      sealCountElement.textContent = "—";

      setDecision("WAITING");
      setConnectionStatus("CONNECTING");
      setMessage("Requesting camera permission…");

      try {
        /*
         * The browser calls Vercel. Vercel securely calls Roboflow.
         */
        const connector =
          connectors.withProxyUrl(VERCEL_PROXY_URL);

        /*
         * Start the local camera at 720p and 15 FPS.
         */
        localCameraStream =
          await streams.useCamera({
            video: {
              width: {
                ideal: 1280
              },
              height: {
                ideal: 720
              },
              frameRate: {
                ideal: 15
              }
            },
            audio: false
          });

        /*
         * Display the local camera immediately while Roboflow
         * connects.
         */
        resultVideo.srcObject =
          localCameraStream;

        await resultVideo.play();

        setConnectionStatus("CAMERA");

        setMessage(
          "Camera connected. Starting Roboflow inference…"
        );

        stopButton.disabled = false;

        /*
         * Start the Roboflow Workflow over WebRTC.
         */
        connection = await webrtc.useStream({
          source: localCameraStream,
          connector,

          wrtcParams: {
            workspaceName:
              WORKSPACE_NAME,

            workflowId:
              WORKFLOW_ID,

            imageInputName:
              IMAGE_INPUT_NAME,

            /*
             * The annotated Workflow image returned as video.
             */
            streamOutputNames: [
              VIDEO_OUTPUT
            ],

            /*
             * Structured values delivered to JavaScript.
             */
            dataOutputNames:
              DATA_OUTPUTS,

            requestedRegion:
              "us",

            requestedPlan:
              "webrtc-gpu-medium",

            processingTimeout:
              3600
          },

          onData:
            handleInferenceData
        });

        setMessage(
          "Connected to Roboflow. Waiting for the first processed frame…"
        );

        const remoteStream =
          await connection.remoteStream();

        if (!remoteStream) {
          throw new Error(
            "Roboflow did not return the processed video stream."
          );
        }

        /*
         * Replace the local preview with the annotated Workflow
         * output.
         */
        resultVideo.srcObject =
          remoteStream;

        await resultVideo.play();

        setConnectionStatus("LIVE");

        setMessage(
          "Inspection is live. Show the complete part to the camera."
        );

        startButton.disabled = true;
        stopButton.disabled = false;
      } catch (error) {
        console.error(
          "Roboflow connection error:",
          error
        );

        const errorMessage =
          error instanceof Error
            ? error.message
            : String(error);

        setConnectionStatus("ERROR");
        setDecision("ERROR");

        if (connection) {
          try {
            await connection.cleanup();
          } catch (cleanupError) {
            console.warn(
              "Connection cleanup failed:",
              cleanupError
            );
          }
        }

        connection = null;

        /*
         * Keep the local camera visible when the Roboflow
         * connection fails.
         */
        if (localCameraStream) {
          resultVideo.srcObject =
            localCameraStream;

          try {
            await resultVideo.play();
          } catch (videoError) {
            console.warn(
              "Unable to continue local camera preview:",
              videoError
            );
          }
        }

        setMessage(
          "Connection error: " + errorMessage
        );

        startButton.disabled = false;

        stopButton.disabled =
          !localCameraStream;
      } finally {
        starting = false;
      }
    }

    async function stopInspection() {
      startButton.disabled = true;
      stopButton.disabled = true;

      setMessage("Stopping inspection…");

      if (connection) {
        try {
          await connection.cleanup();
        } catch (error) {
          console.warn(
            "Connection cleanup failed:",
            error
          );
        }
      }

      connection = null;

      stopLocalCamera();

      resultVideo.pause();
      resultVideo.srcObject = null;

      sealCountElement.textContent = "—";

      setDecision("WAITING");
      setConnectionStatus("OFFLINE");

      setMessage("Inspection stopped.");

      startButton.disabled = false;
      stopButton.disabled = true;
      starting = false;
    }

    startButton.addEventListener(
      "click",
      startInspection
    );

    stopButton.addEventListener(
      "click",
      stopInspection
    );

    window.addEventListener(
      "beforeunload",
      () => {
        if (connection) {
          connection.cleanup();
        }

        stopLocalCamera();
      }
    );
  </script>
</body>
</html>
